<!DOCTYPE html>
<html>
<head>
    <title>Room 1</title>
</head>

<body>

<h1>Room 1</h1>

<p>The door is locked.</p>

<input id="code">

<button onclick="checkCode()">
Unlock
</button>

<script>
function checkCode() {

    let code =
        document.getElementById("code").value;

    if(code === "ORION"){

        window.location =
            "room2.html";

    } else {

        alert("Incorrect.");

    }

}
</script>

</body>
</html>
