<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Grade</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0a1220, #05070f 50%, #000 100%);
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
      text-align: center;
    }

    .card {
      max-width: 620px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 28px;
      padding: 42px 36px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: #f8fafc;
    }

    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Temperature Clue</h1>
    <p>Temperatures matter, I wonder if stars get graded for them. A probably isn't the highest tho</p>
  </div>
</body>
</html>
