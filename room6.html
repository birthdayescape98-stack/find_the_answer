<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiting Room</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1720;
      --panel: rgba(16, 24, 40, 0.9);
      --panel-soft: rgba(30, 41, 59, 0.95);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --shadow: 0 28px 80px rgba(15, 23, 42, 0.35);
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f1720 45%, #020617 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(640px, 100%);
      padding: 38px 42px;
      border-radius: 32px;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-soft) 100%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0 0 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 5vw, 3.6rem);
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.9;
      max-width: 42rem;
    }

    .buttons {
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .button {
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid transparent;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background-color 180ms ease;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.12);
      text-align: left;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.18);
    }

    .button.secondary {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text);
    }

    .button.hidden {
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      padding: 0 22px;
      border: 0;
      pointer-events: none;
      transition: opacity 220ms ease, max-height 220ms ease, padding 220ms ease;
    }

    .button.visible {
      opacity: 1;
      max-height: 100px;
      padding: 16px 22px;
      pointer-events: auto;
    }

    .button.continue {
      background: linear-gradient(135deg, #38bdf8 0%, #7dd3fc 100%);
      color: #0f1720;
      border-color: transparent;
    }

    .note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.75;
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 2.4rem;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <p class="eyebrow">Waiting Room</p>
    <h1>Uhh umm that was quick</h1>
    <p>i didnt think youd get here that fast</p>

    <div class="buttons">
      <button id="ndaButton" class="button">Some more classical puzzles</button>
      <button id="liabilityButton" class="button hidden secondary">Oops I think the webdeveloper needs some time</button>
      <button id="continueButton" class="button hidden continue">Button for: IDC I WANT PUZZLE NOW</button>
    </div>

    <p class="note"> Remember, you made this choice. </p>
  </article>

  <script>
    const ndaButton = document.getElementById('ndaButton');
    const liabilityButton = document.getElementById('liabilityButton');
    const continueButton = document.getElementById('continueButton');

    ndaButton.addEventListener('click', () => {
      liabilityButton.classList.remove('hidden');
      liabilityButton.classList.add('visible');
      ndaButton.disabled = true;
      ndaButton.style.opacity = '0.6';
      ndaButton.style.cursor = 'default';
    });

    liabilityButton.addEventListener('click', () => {
      continueButton.classList.remove('hidden');
      continueButton.classList.add('visible');
      liabilityButton.disabled = true;
      liabilityButton.style.opacity = '0.6';
      liabilityButton.style.cursor = 'default';
    });

    continueButton.addEventListener('click', () => {
      continueButton.textContent = 'Let’s go...';
      continueButton.disabled = true;
      continueButton.style.cursor = 'progress';
      setTimeout(() => {
        window.location.href = 'room7.html';
      }, 600);
    });
  </script>
</body>
</html>
