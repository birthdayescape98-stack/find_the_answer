<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room 5 - Underwater</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #041b2d;
      --panel: rgba(16, 74, 108, 0.92);
      --panel-border: rgba(74, 150, 199, 0.45);
      --text: #d8f1ff;
      --muted: #a3d4ff;
      --accent: #7dd3fc;
      --shadow: 0 26px 80px rgba(1, 18, 35, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(47, 112, 158, 0.95), rgba(4, 27, 45, 1) 70%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 30%), radial-gradient(circle at 80% 30%, rgba(255,255,255,0.08), transparent 22%);
      pointer-events: none;
    }

    .panel {
      position: relative;
      width: min(720px, 100%);
      padding: 42px 36px;
      border-radius: 32px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 55%);
      pointer-events: none;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
      color: #e9f7ff;
    }

    .message {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .hidden-answer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100vw;
      min-height: 28vh;
      margin: 0;
      padding: 24px;
      color: transparent;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      background: transparent;
      font-size: clamp(4rem, 14vw, 10rem);
      font-weight: 800;
      line-height: 0.9;
      pointer-events: auto;
      user-select: text;
      cursor: text;
      z-index: 2;
      white-space: pre-wrap;
      text-align: center;
    }

    .hidden-answer::selection {
      background: rgba(125, 211, 252, 0.45);
      color: #0c182d;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .input-group input {
      flex: 1;
      min-width: 200px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 18px 20px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .input-group button {
      border: none;
      border-radius: 16px;
      background: #38bdf8;
      color: #04263c;
      padding: 18px 26px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 18px 35px rgba(16, 52, 80, 0.28);
      transition: transform 180ms ease, background 180ms ease;
    }

    .input-group button:hover {
      transform: translateY(-1px);
      background: #60a5fa;
    }

    .popup {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(2, 16, 27, 0.85);
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease, visibility 220ms ease;
      padding: 24px;
      z-index: 10;
    }

    .popup.visible {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      width: min(560px, 100%);
      border-radius: 30px;
      background: rgba(6, 37, 58, 0.96);
      border: 1px solid rgba(67, 128, 194, 0.35);
      padding: 34px 32px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .popup-card h2 {
      margin: 0 0 14px;
      color: #a5f3fc;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
    }

    .popup-card p {
      margin: 0;
      color: #dbeafe;
      line-height: 1.75;
      font-size: 1rem;
    }

    .popup-card button {
      margin-top: 26px;
      border: none;
      border-radius: 14px;
      background: #22d3ee;
      color: #04263c;
      padding: 14px 22px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .popup-card button:hover {
      transform: translateY(-1px);
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Another Easy One</h1>
    <p class="message">The answer is right in front of you.</p>
    <div class="input-group">
      <input id="passcode" type="text" placeholder="Enter password" autocomplete="off" />
      <button id="submitBtn" type="button">Enter</button>
    </div>
  </div>
  <p class="hidden-answer">I AM GROOT</p>

  <div class="popup" id="popup">
    <div class="popup-card">
      <h2>BUZZER NOISE: WRONG</h2>
      <p>idk where you got that from</p>
      <button id="closePopup" type="button">Try again</button>
    </div>
  </div>

  <script>
    const expected = 'I AM GROOT';
    const input = document.getElementById('passcode');
    const button = document.getElementById('submitBtn');
    const popup = document.getElementById('popup');
    const closePopup = document.getElementById('closePopup');

    function showPopup() {
      popup.classList.add('visible');
      input.focus();
    }

    function hidePopup() {
      popup.classList.remove('visible');
    }

    function checkPasscode() {
      const value = input.value.trim().toUpperCase();
      if (value === expected) {
        window.location.href = 'room6.txt';
      } else {
        showPopup();
      }
    }

    button.addEventListener('click', checkPasscode);
    closePopup.addEventListener('click', hidePopup);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkPasscode();
      }
    });
  </script>
</body>
</html>
